# AngaWatch — unified docker-compose.yml
# Merges: db/docker-compose.yml  +  docker-compose.yml  +  docker-compose.prod.yml
# Place this file at the project root alongside the .env file.
# Usage:
#   docker compose up --build          (start everything)
#   docker compose up --build dira     (dashboard only)

services:

  # ── InfluxDB ────────────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7.12
    container_name: local_influxdb
    ports:
      - "9999:9999"
    environment:
      - INFLUXD_HTTP_BIND_ADDRESS=:9999
      - INFLUXDB_INIT_MODE=setup
      - INFLUXDB_INIT_USERNAME=${INFLUXDB_USER}
      - INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - INFLUXDB_INIT_BUCKET=Primary_Catchall_Bucket
      - INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
      - ./db/init-buckets.sh:/docker-entrypoint-initdb.d/init-buckets.sh
    restart: always

  # ── Data-ingestion workers (built from db/Dockerfile) ────────────────────

  # --- SCINTILLATION ---
  scintillation_app:
    build:
      context: ./db
      dockerfile: Dockerfile
      args:
        - SCRIPT_NAME=Scintillation_Malindi/Scintillation_Malindi.py
    container_name: local_scintillation
    restart: always
    environment:
      - INFLUXDB_URL=http://influxdb:9999
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=Malindi_Scintillation_Data
    depends_on:
      - influxdb

  # --- IONOSONDE ---
  ionosonde_app:
    build:
      context: ./db
      dockerfile: Dockerfile
      args:
        - SCRIPT_NAME=RealTime_Ionosonde/RealTime_Ionosonde.py
    container_name: local_ionosonde
    restart: always
    environment:
      - INFLUXDB_URL=http://influxdb:9999
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=Malindi_Ionosonde_Autoscaled
    depends_on:
      - influxdb

  # --- ISMR ---
  ismr_app:
    build:
      context: ./db
      dockerfile: Dockerfile
      args:
        - SCRIPT_NAME=ISMR_KSA/ISMR_KSA.py
    container_name: local_ismr
    restart: always
    environment:
      - INFLUXDB_URL=http://influxdb:9999
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=KSA_ISMR
    depends_on:
      - influxdb

  # --- GOES SATELLITE ---
  goes_satellite_app:
    build:
      context: ./db
      dockerfile: Dockerfile
      args:
        - SCRIPT_NAME=GOES_Satellite/GOES_Satellite.py
    container_name: local_goes_satellite
    restart: always
    environment:
      - INFLUXDB_URL=http://influxdb:9999
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=X-Ray Flux
    depends_on:
      - influxdb

  # ── DIRA Dashboard (built from root Dockerfile) ───────────────────────────
  dira:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        - KEEPTRACK_API_KEY=${KEEPTRACK_API_KEY}
    container_name: dira-prod
    env_file:
      - .env
    ports:
      - "80:5544"  # <--- FIX: Maps your laptop's port 80 to the internal node port 5544
    environment:   # <--- FIX: Moved from args so the app can read these at runtime
      - NODE_ENV=production
      - INFLUXDB_URL=http://influxdb:9999
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_X_RAY_BUCKET=${INFLUXDB_X_RAY_BUCKET}
      - INFLUXDB_TART_BUCKET=${INFLUXDB_TART_BUCKET}
      - INFLUXDB_IONOSONDE_BUCKET=${INFLUXDB_IONOSONDE_BUCKET}
    volumes:
      - ./src:/app/src
      - /app/src/engine/ootk
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.59
    healthcheck:
      # FIX: Updated healthcheck to ping port 5544 inside the container
      test: ["CMD-SHELL", "curl -f http://localhost:5544 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  influxdb_config: