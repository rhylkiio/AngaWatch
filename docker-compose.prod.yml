services:
  dira:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/index.html || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
